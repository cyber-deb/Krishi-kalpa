services:
  # Backend FastAPI Web Service
  - type: web
    name: krishi-kalpa-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: krishi-kalpa-db
          property: connectionString

  # Frontend React Static Site
  - type: web
    name: krishi-kalpa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://krishi-kalpa-backend.onrender.com
      - key: VITE_ENABLE_DEMO_MODE
        value: "true"

databases:
  # Managed PostgreSQL Database
  - name: krishi-kalpa-db
    databaseName: krishikalpa
    user: krishi_admin
    plan: free
    region: oregon
